name = "cf-email-gateway"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# One Mailbox Durable Object per agent address (idFromName(address)).
[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox"]

[[send_email]]
name = "EMAIL"

[observability.logs]
enabled = true
invocation_logs = true

# Runtime secret, configured with `wrangler secret put GATEWAY_SECRET` or in the
# dashboard (a secret rather than [vars], so deployments do not reset it):
#   GATEWAY_SECRET  HMAC key for the per-address WebSocket tokens
#                   (bearer token = hex HMAC-SHA256(GATEWAY_SECRET, address))
