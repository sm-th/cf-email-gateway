name = "cf-email-gateway"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# One Mailbox Durable Object per agent address (idFromName(address)).
[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox"]

[[send_email]]
name = "EMAIL"

[observability.logs]
enabled = true
invocation_logs = true

# Runtime secret, configured with `wrangler secret put CA_CERT` or in the
# dashboard (a secret rather than [vars], so deployments do not reset it):
#   CA_CERT  PEM certificate(s) of the CA that issues the guardians' signing
#            certificates; not confidential, the gateway holds no private key.
#            Guardians authenticate with a CMS signature by a certificate this
#            CA issued for the mailbox address (see README).
