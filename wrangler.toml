# Must match WORKER_NAME in src/index.ts (the outbox queue consumer runs this script).
name = "cf-email-gateway"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Raw inbound .eml files, keyed <queue name>/<time>-<uuid>.eml.
[[r2_buckets]]
binding = "AGENT_MAIL"
bucket_name = "email-agents"

# The Worker creates email-outbox (with itself as consumer), email-outbox-dlq
# and the per-agent queues through the REST API on the first email; they are
# not declared here so that deploying does not require them to exist.

[[send_email]]
name = "EMAIL"

[observability.logs]
enabled = true
invocation_logs = true

# Runtime secrets configured with `wrangler secret put` or in the dashboard.
# They are secrets rather than [vars] so that deployments do not reset them:
#   CF_ACCOUNT_ID  Cloudflare account id that owns the per-agent inbound queues
#   CF_API_TOKEN   API token with "Queues Edit" on this account
